name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  analyze-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      # flutter analyze (unlike `dart analyze`) defaults --fatal-infos to on;
      # this project has a backlog of pre-existing info-level lints (missing
      # type annotations, deprecated members) that are out of scope here, so
      # match dart analyze's actual default: only warnings/errors are fatal.
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
