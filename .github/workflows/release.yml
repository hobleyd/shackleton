name: shackleton-release

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Gates everything below: prepare/build-*/deploy all need this (directly
  # or transitively via prepare), so a failure here stops the release before
  # any platform build starts, the same shape nightmail's release.yml uses.
  analyze-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      # dart analyze (not flutter analyze) is what actually loads the
      # riverpod_lint analyzer plugin configured in analysis_options.yaml --
      # flutter analyze silently skips plugin-based diagnostics. It also
      # covers everything flutter analyze does (same flutter_lints rule set),
      # so this replaces rather than supplements that step. --fatal-infos
      # matches flutter analyze's stricter default (dart analyze's own
      # default only fails on warnings/errors).
      - run: dart analyze --fatal-infos
      - run: flutter test

  prepare:
    needs: analyze-and-test
    # Release jobs only make sense off a real commit on main (push) or a
    # manual re-run (workflow_dispatch); a pull_request event only needs the
    # test job above, so prepare (and everything that needs it, transitively)
    # skips there.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7

      - name: Get version from pubspec.yaml
        id: version
        run: |
          VERSION_FULL=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          echo "version=${VERSION_FULL%%+*}" >> $GITHUB_OUTPUT

      - name: Push version tag
        uses: EndBug/latest-tag@latest
        with:
          tag-name: ${{ steps.version.outputs.version }}

  build-macos:
    needs: prepare
    runs-on: macos-latest
    env:
      # `if:` conditions cannot reference the secrets context directly, so
      # gate signing/notarization steps on this instead.
      HAS_SIGNING_CERT: ${{ secrets.MACOS_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: dart run flutter_launcher_icons

      # Only a push to main (or a same-repo PR) carries these secrets; a
      # fork PR builds ad-hoc/unsigned exactly as before, so contributor CI
      # never fails for lacking a certificate it was never meant to have.
      # No provisioning profile needed: shackleton's entitlements don't
      # include keychain-access-groups, the one thing that forces Manual
      # signing to demand one even for Developer ID (see nightmail's
      # release.yml).
      - name: Import Developer ID signing certificate
        if: ${{ env.HAS_SIGNING_CERT == 'true' }}
        env:
          MACOS_CERT_P12_B64: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          echo "$MACOS_CERT_P12_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Patch the checked-out (not committed) pbxproj so Release actually
          # signs with the Developer ID identity just imported. Left alone,
          # Release stays CODE_SIGN_STYLE=Automatic with no DEVELOPMENT_TEAM,
          # i.e. ad-hoc -- exactly what an unsigned/fork run should still get.
          python3 - <<'EOF'
          import pathlib
          path = pathlib.Path("macos/Runner.xcodeproj/project.pbxproj")
          text = path.read_text()

          anchor = "\t\t\t\tCODE_SIGN_ENTITLEMENTS = Runner/Release.entitlements;\n\t\t\t\tCODE_SIGN_STYLE = Automatic;\n"
          assert text.count(anchor) == 1, "Release Runner build-settings anchor not found or not unique -- pbxproj layout changed, update this patch"
          replacement = (
              "\t\t\t\tCODE_SIGN_ENTITLEMENTS = Runner/Release.entitlements;\n"
              "\t\t\t\tCODE_SIGN_IDENTITY = \"Developer ID Application\";\n"
              "\t\t\t\tCODE_SIGN_INJECT_BASE_ENTITLEMENTS = NO;\n"
              "\t\t\t\tCODE_SIGN_STYLE = Manual;\n"
              "\t\t\t\tDEVELOPMENT_TEAM = 69XRMYD9XG;\n"
              "\t\t\t\tENABLE_HARDENED_RUNTIME = YES;\n"
              "\t\t\t\tOTHER_CODE_SIGN_FLAGS = \"--timestamp\";\n"
          )
          text = text.replace(anchor, replacement)

          # TargetAttributes.ProvisioningStyle is a separate, higher-precedence
          # setting Xcode's own UI maintains; per-config CODE_SIGN_STYLE alone
          # doesn't override it, so it has to move to Manual too.
          old_attr = "\t\t\t\t\t\tCreatedOnToolsVersion = 9.2;\n\t\t\t\t\t\tLastSwiftMigration = 1100;\n\t\t\t\t\t\tProvisioningStyle = Automatic;\n"
          assert text.count(old_attr) == 1, "ProvisioningStyle anchor not found or not unique"
          new_attr = "\t\t\t\t\t\tCreatedOnToolsVersion = 9.2;\n\t\t\t\t\t\tLastSwiftMigration = 1100;\n\t\t\t\t\t\tProvisioningStyle = Manual;\n"
          text = text.replace(old_attr, new_attr)

          path.write_text(text)
          EOF

      - run: flutter build macos --release --no-tree-shake-icons --build-number ${{ needs.prepare.outputs.build_number }}

      - name: Notarize and staple
        if: ${{ env.HAS_SIGNING_CERT == 'true' }}
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          APP_PATH="build/macos/Build/Products/Release/shackleton.app"
          echo "$NOTARY_KEY_P8" > "$RUNNER_TEMP/notary_key.p8"

          ditto -c -k --keepParent "$APP_PATH" "$RUNNER_TEMP/shackleton-notarize.zip"
          # --wait exits 0 once Apple responds at all, Accepted or Invalid --
          # a rejection is not a CLI failure, so the status has to be checked
          # explicitly rather than relying on notarytool's own exit code.
          SUBMIT_OUTPUT=$(xcrun notarytool submit "$RUNNER_TEMP/shackleton-notarize.zip" \
            --key "$RUNNER_TEMP/notary_key.p8" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            --wait)
          echo "$SUBMIT_OUTPUT"
          SUBMISSION_ID=$(echo "$SUBMIT_OUTPUT" | awk '/id:/ { print $2; exit }')
          if ! echo "$SUBMIT_OUTPUT" | grep -q "status: Accepted"; then
            echo "::error::Notarization did not succeed -- fetching the detailed log"
            xcrun notarytool log "$SUBMISSION_ID" \
              --key "$RUNNER_TEMP/notary_key.p8" \
              --key-id "$NOTARY_KEY_ID" \
              --issuer "$NOTARY_ISSUER_ID"
            exit 1
          fi
          xcrun stapler staple "$APP_PATH"

      # create-dmg is called directly rather than through
      # lethja/create-dmg-action, which derives *three* things from its one
      # `name` input: the output file, `--volname`, and `--icon <name>.app` —
      # and that last one names the bundle **inside** the volume, which Finder
      # then has to find to position it. So the version can't be added to the
      # file name without also claiming the app is called
      # `shackleton-<version>.app`, which fails with "Can't set item ...
      # (-10006)". The bundle name is resolved from disk instead. See
      # nightmail's release.yml for the same trap and fix.
      - name: Create DMG
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          APP_DIR="build/macos/Build/Products/Release"
          APP_BUNDLE_NAME=$(basename "$(ls -d "$APP_DIR"/*.app | head -1)")
          if [ -z "$APP_BUNDLE_NAME" ]; then
            echo "::error::no .app in $APP_DIR to build a DMG from" >&2
            exit 1
          fi
          echo "Packaging $APP_BUNDLE_NAME as shackleton-$VERSION.dmg"
          brew install create-dmg
          create-dmg \
            --volname "Shackleton $VERSION" \
            --window-pos 200 120 \
            --window-size 800 450 \
            --icon-size 100 \
            --icon "$APP_BUNDLE_NAME" 200 185 \
            --app-drop-link 600 185 \
            "shackleton-$VERSION.dmg" \
            "$APP_DIR/$APP_BUNDLE_NAME"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          name: 'shackleton-${{ needs.prepare.outputs.version }}'
          tag_name: ${{ needs.prepare.outputs.version }}
          files: shackleton-${{ needs.prepare.outputs.version }}.dmg

      - name: Package for desktop_updater
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          BUILD_NUMBER="${{ needs.prepare.outputs.build_number }}"
          ARTIFACT_URL="https://hobleyd.github.io/shackleton/releases/${VERSION}+${BUILD_NUMBER}-macos/shackleton-${VERSION}-macos.zip"
          dart run desktop_updater:package \
            --input "build/macos/Build/Products/Release/shackleton.app" \
            --output "dist/${BUILD_NUMBER}/macos" \
            --package-id "au.com.sharpblue.shackleton" \
            --app-name "shackleton" \
            --version "${VERSION}" \
            --build-number "${BUILD_NUMBER}" \
            --platform macos \
            --artifact-url "${ARTIFACT_URL}" \
            --install-strategy wholeBundleReplace

      - name: Import release signing key
        env:
          DESKTOP_UPDATER_KEY_PASSPHRASE: ${{ secrets.DESKTOP_UPDATER_KEY_PASSPHRASE }}
        run: |
          echo "${{ secrets.DESKTOP_UPDATER_KEY_BUNDLE_B64 }}" | base64 --decode > "$RUNNER_TEMP/release-key.dukey"
          dart run desktop_updater:release keys import \
            --input "$RUNNER_TEMP/release-key.dukey" \
            --passphrase-env DESKTOP_UPDATER_KEY_PASSPHRASE

      - name: Sign release descriptor
        run: |
          dart run desktop_updater:release sign \
            --release "dist/${{ needs.prepare.outputs.build_number }}/macos/release.json" \
            --key-profile desktop_updater.keys.json

      - name: Upload distribution artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-dist
          path: dist/${{ needs.prepare.outputs.build_number }}/macos/

      - name: Remove signing keychain
        if: ${{ always() && env.HAS_SIGNING_CERT == 'true' }}
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

  build-windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false

      - run: flutter config --enable-windows-desktop
      - run: flutter create --platforms=windows .
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: dart run flutter_launcher_icons
      - run: flutter build windows --release --no-tree-shake-icons --build-number ${{ needs.prepare.outputs.build_number }}

      - name: Copy sqlite3.dll
        shell: bash
        run: |
          curl -L -o build/windows/x64/runner/Release/sqlite3.dll \
            "https://github.com/tekartik/sqflite/raw/master/sqflite_common_ffi/lib/src/windows/sqlite3.dll"

      - name: Create Windows installer
        run: dart run windows.dart
        env:
          VERSION: ${{ needs.prepare.outputs.version }}

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          name: 'shackleton-${{ needs.prepare.outputs.version }}'
          tag_name: ${{ needs.prepare.outputs.version }}
          files: build/windows/shackleton-${{ needs.prepare.outputs.version }}.exe

      - name: Package for desktop_updater
        shell: bash
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          BUILD_NUMBER="${{ needs.prepare.outputs.build_number }}"
          ARTIFACT_URL="https://hobleyd.github.io/shackleton/releases/${VERSION}+${BUILD_NUMBER}-windows/shackleton-${VERSION}-windows.zip"
          dart run desktop_updater:package \
            --input "build/windows/x64/runner/Release" \
            --output "dist/${BUILD_NUMBER}/windows" \
            --package-id "au.com.sharpblue.shackleton" \
            --app-name "shackleton" \
            --version "${VERSION}" \
            --build-number "${BUILD_NUMBER}" \
            --platform windows \
            --artifact-url "${ARTIFACT_URL}" \
            --install-strategy wholeDirectoryReplace

      - name: Import release signing key
        shell: bash
        env:
          DESKTOP_UPDATER_KEY_PASSPHRASE: ${{ secrets.DESKTOP_UPDATER_KEY_PASSPHRASE }}
        run: |
          echo "${{ secrets.DESKTOP_UPDATER_KEY_BUNDLE_B64 }}" | base64 --decode > "$RUNNER_TEMP/release-key.dukey"
          dart run desktop_updater:release keys import \
            --input "$RUNNER_TEMP/release-key.dukey" \
            --passphrase-env DESKTOP_UPDATER_KEY_PASSPHRASE

      - name: Sign release descriptor
        shell: bash
        run: |
          dart run desktop_updater:release sign \
            --release "dist/${{ needs.prepare.outputs.build_number }}/windows/release.json" \
            --key-profile desktop_updater.keys.json

      - name: Upload distribution artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-dist
          path: dist/${{ needs.prepare.outputs.build_number }}/windows/

  build-linux:
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64
          cache: false

      - run: sudo apt-get update -y
      - run: sudo apt-get install -y ninja-build libgtk-3-dev libmpv-dev libmpv2 binutils coreutils desktop-file-utils fakeroot fuse libgdk-pixbuf2.0-dev patchelf python3-pip python3-setuptools squashfs-tools strace util-linux zsync

      - run: flutter config --enable-linux-desktop
      - run: flutter create --platforms=linux .
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: dart run flutter_launcher_icons
      - run: flutter build linux --release --no-tree-shake-icons

      - name: Prepare bundle assets
        run: cp assets/explorer.png build/linux/x64/release/bundle/shackleton.png

      - name: Copy missing libs into bundle
        run: |
          BUNDLE_LIB=build/linux/x64/release/bundle/lib
          copy_if_missing() {
            local lib=$1
            local found=$(find /usr/lib/x86_64-linux-gnu /usr/lib -name "$lib" 2>/dev/null | head -1)
            if [ -n "$found" ]; then
              echo "Copying $found"
              cp "$found" "$BUNDLE_LIB/"
            else
              echo "WARNING: $lib not found on host"
            fi
          }
          ldd build/linux/x64/release/bundle/shackleton \
            | grep "not found" \
            | awk '{print $1}' \
            | while read lib; do copy_if_missing "$lib"; done
          for solib in "$BUNDLE_LIB"/*.so*; do
            ldd "$solib" 2>/dev/null \
              | grep "not found" \
              | awk '{print $1}' \
              | while read lib; do copy_if_missing "$lib"; done
          done

      - name: Install Snapcraft
        run: sudo snap install snapcraft --classic

      - name: Build Snap package
        run: |
          sed -i "s/^version: .*/version: '${{ needs.prepare.outputs.version }}'/" snap/snapcraft.yaml
          snapcraft --destructive-mode

      - name: Upload Snap to GitHub Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          name: 'shackleton-${{ needs.prepare.outputs.version }}'
          tag_name: ${{ needs.prepare.outputs.version }}
          files: shackleton_${{ needs.prepare.outputs.version }}_amd64.snap

  deploy:
    needs: [prepare, build-macos, build-windows]
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download macOS distribution
        uses: actions/download-artifact@v8
        with:
          name: macos-dist
          path: deploy/releases/${{ needs.prepare.outputs.version }}+${{ needs.prepare.outputs.build_number }}-macos/

      - name: Download Windows distribution
        uses: actions/download-artifact@v8
        with:
          name: windows-dist
          path: deploy/releases/${{ needs.prepare.outputs.version }}+${{ needs.prepare.outputs.build_number }}-windows/

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false

      - run: flutter pub get

      - name: Update app-archive.json
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          BUILD_NUMBER="${{ needs.prepare.outputs.build_number }}"

          git fetch origin gh-pages 2>/dev/null || true
          if git show origin/gh-pages:app-archive.json > deploy/app-archive.json 2>/dev/null \
              && jq -e '.schemaVersion == 3' deploy/app-archive.json > /dev/null 2>&1; then
            echo "Using existing schema v3 app-archive.json from gh-pages"
            # The published archive is signed from the previous run; upsert
            # refuses to touch a signed archive, and the whole thing is
            # re-signed below anyway.
            jq 'del(.signature)' deploy/app-archive.json > deploy/app-archive.json.tmp
            mv deploy/app-archive.json.tmp deploy/app-archive.json
          else
            rm -f deploy/app-archive.json
            echo "No compatible existing app-archive.json found; starting a new schema v3 index"
          fi

          for PLATFORM in macos windows; do
            dart run desktop_updater:app_archive upsert \
              --archive deploy/app-archive.json \
              --app-name "shackleton" \
              --version "$VERSION" \
              --build-number "$BUILD_NUMBER" \
              --platform "$PLATFORM" \
              --channel stable \
              --release-url "https://hobleyd.github.io/shackleton/releases/${VERSION}+${BUILD_NUMBER}-${PLATFORM}/release.json"
          done

      - name: Import release signing key
        env:
          DESKTOP_UPDATER_KEY_PASSPHRASE: ${{ secrets.DESKTOP_UPDATER_KEY_PASSPHRASE }}
        run: |
          echo "${{ secrets.DESKTOP_UPDATER_KEY_BUNDLE_B64 }}" | base64 --decode > "$RUNNER_TEMP/release-key.dukey"
          dart run desktop_updater:release keys import \
            --input "$RUNNER_TEMP/release-key.dukey" \
            --passphrase-env DESKTOP_UPDATER_KEY_PASSPHRASE

      - name: Sign app-archive.json
        run: |
          dart run desktop_updater:release sign \
            --app-archive deploy/app-archive.json \
            --key-profile desktop_updater.keys.json

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          # Past releases must survive: an app still on an old version fetches
          # its descriptor from the URL the archive recorded at the time.
          keep_files: true
